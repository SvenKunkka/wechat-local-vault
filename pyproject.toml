[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-local-vault"
version = "0.2.0"
description = "Offline, private, explicit-input archive for WeChat exports"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SvenKunkka"}]
readme = "README.md"
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: MacOS", "Operating System :: POSIX :: Linux"]

[project.scripts]
wechat-vault = "wechat_vault.cli:main"

[tool.setuptools.packages.find]
include = ["wechat_vault*"]
